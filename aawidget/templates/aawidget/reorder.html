{% load i18n %}
{% comment %}
Onzichtbaar draagblok: levert de CSS + JS die de andere dashboardblokken
sleepbaar én in breedte instelbaar maakt. Volgorde + breedte worden per
gebruiker onthouden (localStorage).
{% endcomment %}
<div id="aaw-carrier" class="col-12" style="display:none;">
<style>
    .aaw-bar { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
        margin:0 0 .9rem; padding:.45rem .75rem; border-radius:10px;
        border:1px solid rgba(0,180,216,.28); background:rgba(0,180,216,.06);
        font-size:.8rem; color:#8a93b2; }
    .aaw-bar b { color:#00b4d8; }
    .aaw-reset { background:none; border:1px solid rgba(255,255,255,.16); color:#8a93b2;
        border-radius:6px; padding:.12rem .55rem; font-size:.72rem; cursor:pointer; }
    .aaw-reset:hover { color:#fff; border-color:rgba(0,180,216,.5); }
    .aaw-item { position:relative; }
    .aaw-tools { position:absolute; top:10px; right:10px; z-index:6; display:flex; gap:3px;
        opacity:0; transition:opacity .12s; }
    .aaw-item:hover .aaw-tools { opacity:1; }
    .aaw-btn { width:26px; height:24px; display:flex; align-items:center; justify-content:center;
        color:#cbd3ea; background:rgba(0,0,0,.6); border:1px solid rgba(0,180,216,.35);
        border-radius:6px; font-size:.85rem; cursor:pointer; user-select:none; padding:0; }
    .aaw-btn:hover { color:#fff; border-color:rgba(0,180,216,.7); background:rgba(0,180,216,.2); }
    .aaw-btn:disabled { opacity:.3; cursor:default; }
    .aaw-handle { cursor:grab; }
    .aaw-handle:active { cursor:grabbing; }
    .aaw-item.aaw-drag { opacity:.45; }
    .aaw-item.aaw-over { outline:2px dashed rgba(0,180,216,.65); outline-offset:-3px; border-radius:8px; }
</style>
<script>
(function () {
    var OKEY = 'aawidget_dash_order';
    var WKEY = 'aawidget_dash_width';
    var STEPS = [3, 4, 6, 8, 12];   // kwart, derde, half, tweederde, vol
    function ready(fn) {
        if (document.readyState !== 'loading') { fn(); }
        else { document.addEventListener('DOMContentLoaded', fn); }
    }
    ready(function () {
        var carrier = document.getElementById('aaw-carrier');
        if (!carrier) { return; }
        var row = carrier.parentElement;
        if (!row) { return; }

        var items = [].slice.call(row.children).filter(function (el) { return el !== carrier; });
        if (items.length < 2) { return; }

        function keyOf(el) {
            if (el.dataset.aawKey) { return el.dataset.aawKey; }
            var h = el.querySelector('h1,h2,h3,h4,h5,h6,.card-header,.card-title,.obc-title');
            var t = (h ? h.textContent : '').trim().replace(/\s+/g, ' ').toLowerCase().slice(0, 60);
            if (!t) { t = 'blok-' + Array.prototype.indexOf.call(row.children, el); }
            el.dataset.aawKey = t;
            return t;
        }

        // ── breedte ──────────────────────────────────────────────────────
        function loadWidths() { try { return JSON.parse(localStorage.getItem(WKEY) || '{}'); } catch (e) { return {}; } }
        function saveWidths(w) { try { localStorage.setItem(WKEY, JSON.stringify(w)); } catch (e) {} }
        function origSpan(el) {
            var m = (el.className || '').match(/col-(?:xl-|lg-|md-|sm-)?(\d{1,2})(?!\d)/g);
            var span = 12;
            if (m) { var last = m[m.length - 1].match(/(\d{1,2})$/); if (last) { span = parseInt(last[1], 10); } }
            return Math.min(12, Math.max(1, span));
        }
        function applyWidth(el, span) {
            var pct = (span / 12 * 100);
            el.style.flex = '0 0 ' + pct + '%';
            el.style.maxWidth = pct + '%';
            el.style.width = pct + '%';
            el.dataset.aawSpan = span;
        }
        function currentSpan(el) {
            if (el.dataset.aawSpan) { return parseInt(el.dataset.aawSpan, 10); }
            return origSpan(el);
        }
        function stepWidth(el, dir) {
            var span = currentSpan(el);
            var i = STEPS.indexOf(span);
            if (i === -1) {  // dichtstbijzijnde stap zoeken
                i = 0; for (var j = 0; j < STEPS.length; j++) { if (STEPS[j] <= span) { i = j; } }
            }
            i = Math.max(0, Math.min(STEPS.length - 1, i + dir));
            applyWidth(el, STEPS[i]);
            var w = loadWidths(); w[keyOf(el)] = STEPS[i]; saveWidths(w);
        }

        // ── slepen ───────────────────────────────────────────────────────
        var drag = null;
        function clearOver() { items.forEach(function (el) { el.classList.remove('aaw-over'); }); }
        function currentOrder() {
            return [].slice.call(row.children)
                .filter(function (el) { return el !== carrier && el.classList.contains('aaw-item'); })
                .map(keyOf);
        }
        function saveOrder() { try { localStorage.setItem(OKEY, JSON.stringify(currentOrder())); } catch (e) {} }

        var savedW = loadWidths();
        items.forEach(function (el) {
            keyOf(el);
            el.classList.add('aaw-item');
            if (savedW[keyOf(el)]) { applyWidth(el, savedW[keyOf(el)]); }

            var tools = document.createElement('div');
            tools.className = 'aaw-tools';
            tools.innerHTML =
                '<button type="button" class="aaw-btn aaw-smaller" title="{% translate "Smaller" %}">&#9668;</button>' +
                '<span class="aaw-btn aaw-handle" title="{% translate "Versleep om te herschikken" %}" draggable="true">&#9776;</span>' +
                '<button type="button" class="aaw-btn aaw-bigger" title="{% translate "Breder" %}">&#9658;</button>';
            el.appendChild(tools);

            tools.querySelector('.aaw-smaller').addEventListener('click', function (e) { e.stopPropagation(); stepWidth(el, -1); });
            tools.querySelector('.aaw-bigger').addEventListener('click', function (e) { e.stopPropagation(); stepWidth(el, 1); });

            var handle = tools.querySelector('.aaw-handle');
            handle.addEventListener('dragstart', function (e) {
                drag = el; el.classList.add('aaw-drag');
                e.dataTransfer.effectAllowed = 'move';
                try { e.dataTransfer.setData('text/plain', keyOf(el)); } catch (_) {}
            });
            handle.addEventListener('dragend', function () {
                if (drag) { drag.classList.remove('aaw-drag'); }
                drag = null; clearOver(); saveOrder();
            });
        });

        row.addEventListener('dragover', function (e) {
            if (!drag) { return; }
            e.preventDefault();
            var t = e.target.closest ? e.target.closest('.aaw-item') : null;
            clearOver();
            if (t && t !== drag) {
                t.classList.add('aaw-over');
                var r = t.getBoundingClientRect();
                var before = (e.clientX < r.left + r.width / 2);
                row.insertBefore(drag, before ? t : t.nextSibling);
            }
        });

        // Opgeslagen volgorde toepassen (nieuwe blokken blijven achteraan).
        (function applyOrder() {
            var saved;
            try { saved = JSON.parse(localStorage.getItem(OKEY) || '[]'); } catch (e) { saved = []; }
            if (!saved || !saved.length) { return; }
            var map = {};
            items.forEach(function (el) { map[keyOf(el)] = el; });
            saved.forEach(function (k) { if (map[k]) { row.insertBefore(map[k], carrier); } });
        })();

        // Controlebalk bovenaan.
        var bar = document.createElement('div');
        bar.className = 'col-12';
        bar.style.order = '-1';
        bar.innerHTML = '<div class="aaw-bar">' +
            '<span>&#8645; <b>{% translate "Herschik je dashboard" %}</b> — ' +
            '{% translate "sleep aan de greep, of maak een blok smaller/breder met de pijltjes." %}</span>' +
            '<button type="button" class="aaw-reset">{% translate "Herstel standaard" %}</button></div>';
        row.insertBefore(bar, row.firstChild);
        bar.querySelector('.aaw-reset').addEventListener('click', function () {
            try { localStorage.removeItem(OKEY); localStorage.removeItem(WKEY); } catch (e) {}
            location.reload();
        });
    });
})();
</script>
</div>
